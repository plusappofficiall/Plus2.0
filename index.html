<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plus 2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .logo {
            font-size: 120px;
            color: #FF6B00;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -5px;
        }

        .slogan {
            font-size: 42px;
            font-weight: 300;
            color: #FF6B00;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background-color: #000000;
            border: 1px solid #FF6B00;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #FF8C00;
        }

        input::placeholder {
            color: #666666;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background-color: #FF6B00;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #FF8C00;
        }

        .register {
            margin-top: 25px;
            font-size: 14px;
            color: #888888;
        }

        .register a {
            color: #FF6B00;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .version {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 12px;
            color: rgba(255, 107, 0, 0.3);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">+</div>
        <div class="slogan">Sadece Kelimeler.</div>
        <form>
            <div class="input-group">
                <input type="email" placeholder="E-posta" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Şifre" required>
            </div>
            <button type="submit" class="btn">Giriş Yap</button>
        </form>
        <div class="register">
            Hesabın yok mu? <a href="#">Kayıt Ol</a>
        </div>
    </div>
    <div class="version">Plus 2.0</div>
</body>
    </html>
